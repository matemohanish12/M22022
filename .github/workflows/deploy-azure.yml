name: Deploy to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  infra-deploy:
    name: Deploy Azure infra (Bicep)
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_RG != '' && secrets.AZURE_SITE_NAME != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        run: |
          az account show
          az group create -n ${{ secrets.AZURE_RG }} -l ${{ secrets.AZURE_REGION }}
          az deployment group create -g ${{ secrets.AZURE_RG }} --template-file infra/azure/main.bicep --parameters siteName=${{ secrets.AZURE_SITE_NAME }} postgresAdministratorPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }} location=${{ secrets.AZURE_REGION }}

  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    needs: infra-deploy
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEBAPPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          app_build_command: npm run build
          output_location: dist

  deploy-backend:
    name: Deploy backend to Azure Web App
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success() && secrets.AZURE_BACKEND_PUBLISH_PROFILE != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./backend

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()
    steps:
      - name: Send summary
        run: |
          echo "Deployment finished. Check preceding job logs for details."
